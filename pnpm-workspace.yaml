allowBuilds:
  "@firebase/util": false
  esbuild: true
  protobufjs: false
# Versão estável anterior à publicação rejeitada pela política de idade mínima.
# Configuração compartilhada por pnpm 10 (projeto) e 11 (ambiente de validação).
overrides:
  re2js: 2.9.1

# O front usa os artefatos distribuídos; não executa postinstall dessas bibliotecas.
ignoredBuiltDependencies:
  - "@firebase/util"
  - protobufjs

# O instalador do esbuild verifica o binário usado pelo executor de testes.
onlyBuiltDependencies:
  - esbuild
